<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSC Attendance System - Muallimin Scientific Community</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#334e68',
                            800: '#102a43',
                            900: '#0f172a'
                        },
                        brand: {
                            cyan: '#06b6d4',
                            teal: '#0d9488',
                            blue: '#2563eb'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Custom Style File -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full text-slate-800 dark:text-slate-100 dark:bg-slate-900 transition-colors duration-200">

    <div class="min-h-full flex flex-col md:flex-row">
        <!-- Sidebar Mobile Drawer Overlay -->
        <div id="mobileDrawerBackdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden transition-opacity"></div>

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 flex flex-col transition-all duration-300 ease-in-out -translate-x-full md:translate-x-0 md:static md:z-auto no-print">
            <!-- Sidebar Header -->
            <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-bold shrink-0 shadow-lg shadow-cyan-500/20">
                        <i data-lucide="atom" class="w-5 h-5 text-white"></i>
                    </div>
                    <div class="flex flex-col sidebar-text">
                        <span id="sysNameHeader" class="font-bold text-white text-sm leading-tight truncate">MSC Attendance</span>
                        <span id="orgNameHeader" class="text-xs text-slate-400 truncate">Muallimin Sci Comm</span>
                    </div>
                </div>
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scrollbar">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-300">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 text-cyan-400"></i>
                    <span class="sidebar-text truncate">Dashboard</span>
                </button>
                <button onclick="switchTab('presensi')" id="nav-presensi" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-300">
                    <i data-lucide="clipboard-check" class="w-4 h-4 text-emerald-400"></i>
                    <span class="sidebar-text truncate">Presensi</span>
                </button>
                <button onclick="switchTab('riwayat')" id="nav-riwayat" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-300">
                    <i data-lucide="history" class="w-4 h-4 text-amber-400"></i>
                    <span class="sidebar-text truncate">Riwayat Kegiatan</span>
                </button>
                <button onclick="switchTab('anggota')" id="nav-anggota" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-300">
                    <i data-lucide="users" class="w-4 h-4 text-indigo-400"></i>
                    <span class="sidebar-text truncate">Data Anggota</span>
                </button>
                <button onclick="switchTab('statistik')" id="nav-statistik" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-300">
                    <i data-lucide="line-chart" class="w-4 h-4 text-purple-400"></i>
                    <span class="sidebar-text truncate">Statistik Kehadiran</span>
                </button>
                <button onclick="switchTab('laporan')" id="nav-laporan" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-300">
                    <i data-lucide="file-text" class="w-4 h-4 text-rose-400"></i>
                    <span class="sidebar-text truncate">Laporan & Rekap</span>
                </button>
                <button onclick="switchTab('pengaturan')" id="nav-pengaturan" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors hover:bg-slate-800 text-slate-300">
                    <i data-lucide="settings" class="w-4 h-4 text-slate-400"></i>
                    <span class="sidebar-text truncate">Pengaturan</span>
                </button>
            </nav>

            <!-- Sidebar Footer & Theme Toggle -->
            <div class="p-3 border-t border-slate-800 flex items-center justify-between">
                <div class="sidebar-text text-xs text-slate-400 truncate">
                    <span id="periodBadge">Periode 2024/2025</span>
                </div>
                <button onclick="toggleTheme()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors" title="Beralih Tema">
                    <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Top App Bar -->
            <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700/60 flex items-center justify-between px-4 md:px-6 z-10 no-print">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-600 dark:text-slate-300 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <h1 id="pageTitle" class="text-lg md:text-xl font-bold text-slate-900 dark:text-white truncate">Dashboard</h1>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="hidden sm:flex items-center bg-slate-100 dark:bg-slate-700/50 rounded-lg px-3 py-1.5 text-xs text-slate-500 dark:text-slate-300 border border-slate-200 dark:border-slate-600">
                        <i data-lucide="calendar" class="w-3.5 h-3.5 mr-2 text-cyan-500"></i>
                        <span id="currentDateDisplay"></span>
                    </div>
                </div>
            </header>

            <!-- Page Dynamic Content Canvas -->
            <main class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-50 dark:bg-slate-900">
                <div id="contentContainer" class="max-w-7xl mx-auto space-y-6">
                    <!-- Dynamic View Rendered Here -->
                </div>
            </main>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200 no-print">
        <div id="modalCard" class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 max-w-2xl w-full max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-200">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/80 rounded-t-xl">
                <h3 id="modalTitle" class="font-bold text-lg text-slate-900 dark:text-white">Modal Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4">
                <!-- Content injected here -->
            </div>
            <div id="modalFooter" class="px-6 py-3 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/80 flex justify-end space-x-2 rounded-b-xl">
                <!-- Footer buttons injected here -->
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none no-print"></div>

    <!-- Custom Script File -->
    <script src="app.js"></script>
</body>
</html>
